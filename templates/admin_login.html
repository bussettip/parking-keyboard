<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Parking</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 40px; width: 360px; }
h1 { font-size: 24px; margin-bottom: 24px; text-align: center; color: #f0f6fc; }
label { display: block; margin-bottom: 6px; font-size: 14px; }
input[type="password"] { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; margin-bottom: 16px; }
button { width: 100%; padding: 10px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; }
button:hover { background: #2ea043; }
.error { background: #3d1f1f; border: 1px solid #f85149; border-radius: 6px; padding: 10px; margin-bottom: 16px; font-size: 14px; text-align: center; color: #f85149; }
</style>
</head>
<body>
<div class="login-box">
<h1>Acceso Administrador</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<label for="password">Contraseña</label>
<input type="password" name="password" id="password" placeholder="Contraseña" autofocus required>
<button type="submit">Ingresar</button>
</form>
</div>
</body>
</html>
