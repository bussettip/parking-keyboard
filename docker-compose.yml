services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: parking_db
      MYSQL_USER: ocr_user
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    expose:
      - "5100"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: parking_db
      DB_USER: ocr_user
      DB_PASS: "123456"
      MODE: "exit"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
